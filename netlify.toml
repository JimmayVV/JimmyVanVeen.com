[build]
command = "npm run build"
publish = "build/client"

# `npm run build` now goes through Turborepo (ADR 14). Netlify starts from a
# clean checkout every time, so there is never a .turbo cache to hit here —
# this only silences the first-run telemetry notice.
[build.environment]
TURBO_TELEMETRY_DISABLED = "1"

# Node version lives solely in .nvmrc (Netlify reads it), which also fixes the
# bundled npm. No NODE_VERSION here on purpose — one source of truth.

# The blog share-card renderer (app/og) loads WebAssembly from node_modules at
# runtime: resvg's rasteriser, and harfbuzz, which satori uses to shape text.
# The function bundler traces JavaScript, not files read by path, so without
# these lines the .wasm files aren't shipped. A missing hb.wasm aborted the
# whole process on the first card request.
[functions]
included_files = [
  "node_modules/@resvg/resvg-wasm/index_bg.wasm",
  "node_modules/harfbuzzjs/hb.wasm",
  "node_modules/satori/yoga.wasm",
]

[dev]
command = "npm run dev"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"
