name: CI

# Lint, typecheck, test, build, and Playwright come from fleet-ci.
# See https://github.com/JimmayVV/fleet-ci for the reusable workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: JimmayVV/fleet-ci/.github/workflows/node-ci.yml@v1
    with:
      package-manager: npm
      format-check: true
      playwright: true
      turbo-cache: true
      build-env: |
        JVV_ALLOW_EMAILS=false
        JVV_RECAPTCHA_SITE_KEY=test-key
