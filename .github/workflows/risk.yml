name: Risk

# Labels each PR risk:low / risk:medium / risk:high and arms auto-merge on
# low. Dependabot patch and minor updates are armed separately.
# Policy lives in https://github.com/JimmayVV/fleet-ci.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  risk:
    uses: JimmayVV/fleet-ci/.github/workflows/risk.yml@v1
    with:
      high-paths: |
        server/**
        app/routes/email.tsx
        app/utils/mail.ts
        netlify.toml
        .github/workflows/**

  dependabot:
    uses: JimmayVV/fleet-ci/.github/workflows/dependabot-automerge.yml@v1
